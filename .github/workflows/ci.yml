name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install linting tools
        run: pip install ruff black
          
      - name: Check Python formatting with Black
        run: |
          black --check api/ --diff || true
          
      - name: Run Ruff linter
        run: |
          ruff check api/ --fix || true

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install requests
          
      - name: Start PostgreSQL and API
        run: |
          # Wait for Postgres to be ready
          sleep 10
          
          # Set environment variables
          export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          export POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          
          # Start API in background
          cd api
          python -c "
import os
os.environ['POSTGRES_HOST'] = 'localhost'
os.environ['POSTGRES_PORT'] = '5432'
os.environ['POSTGRES_USER'] = '${{ secrets.POSTGRES_USER }}'
os.environ['POSTGRES_PASSWORD'] = '${{ secrets.POSTGRES_PASSWORD }}'
os.environ['POSTGRES_DB'] = '${{ secrets.POSTGRES_DB }}'

from main import app
import uvicorn
uvicorn.run(app, host='127.0.0.1', port=8000)
" &
          
          # Wait for API to start
          sleep 15
          
      - name: Run API tests
        run: |
          sleep 5
          python api/test_api.py

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test-api
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build API image
        run: docker compose build api
          
      - name: Build n8n image
        run: docker compose build n8n || true